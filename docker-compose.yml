version: '3.8'
services:
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    
    env_file:
      - ./apps/server/.env

    depends_on:
      - db

  mobile:
    build:
      context: ./apps/mobile
      dockerfile: Dockerfile

    ports:
      - "5173:5173"

  db:
    image: postgres:15-alpine
    
    container_name: snack_db

    expose:
      - "5432"
    env_file:
      - postgres.env

    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    
volumes:
  pgdata:
    
